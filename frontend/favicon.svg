<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- background so it reads on any browser tab theme -->
  <rect x="0" y="0" width="40" height="40" rx="8" fill="#1C1B1A"/>

  <!-- solid brass wheel -->
  <circle cx="20" cy="20" r="15" fill="#E0C374"/>

  <!-- notch where the finger stop breaks the rim -->
  <path d="M28.6 24 L32 23.4 L30.6 27 Z" fill="#1C1B1A"/>
  <!-- finger stop tab, poking past the rim -->
  <path d="M32 23.4 L30.6 27 L33.4 26.1 Z" fill="#E0C374"/>

  <!-- punched finger holes -->
  <circle cx="20" cy="10.5" r="2.5" fill="#1C1B1A"/>
  <circle cx="26.5" cy="13.5" r="2.5" fill="#1C1B1A"/>
  <circle cx="29.5" cy="20" r="2.5" fill="#1C1B1A"/>
  <circle cx="26.5" cy="26.5" r="2.5" fill="#1C1B1A"/>
  <circle cx="20" cy="29.5" r="2.5" fill="#1C1B1A"/>
  <circle cx="13.5" cy="26.5" r="2.5" fill="#1C1B1A"/>
  <circle cx="10.5" cy="20" r="2.5" fill="#1C1B1A"/>
  <circle cx="13.5" cy="13.5" r="2.5" fill="#1C1B1A"/>

  <!-- center hub -->
  <circle cx="20" cy="20" r="3" fill="#1C1B1A"/>
  <circle cx="20" cy="20" r="1" fill="#E0C374"/>
</svg>
